name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.13.0', '24.0.0']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install with engine checks
        run: npm ci --engine-strict

      # Fails fast if files were uploaded into the wrong folder, or a hidden
      # folder (.github, .gitignore) is missing — the most common upload mistake.
      - name: Repository layout
        run: npm run check:layout

      # Figma's plugin sandbox rejects some source text even inside comments.
      - name: Figma sandbox check
        run: npm run check

      - name: Lint (including the script inside ui.html)
        run: npm run lint

      - name: Code generation, privacy and change-tracking tests
        run: npm test

  browser:
    name: Browser (panel + preview sandbox)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install browser test dependencies
        run: npm ci --engine-strict

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Panel render and preview isolation
        run: python3 tests/browser.py

  release:
    name: Release ZIP
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build devready-plugin.zip
        run: node scripts/zip.js

      - name: Create release or attach missing ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A maintainer may already have published this tag with release notes.
          # Preserve an existing ZIP (and its checksum) rather than replacing it.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fxq 'devready-plugin.zip'; then
              echo "Release and ZIP already exist; keeping them unchanged."
            else
              gh release upload "${GITHUB_REF_NAME}" devready-plugin.zip
            fi
          else
            version="${GITHUB_REF_NAME#v}"
            notes="$(mktemp)"
            # Version headings use `## [x.y.z]`; stop at the next version.
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$notes"
            if [ ! -s "$notes" ]; then
              echo "No changelog section for ${GITHUB_REF_NAME}; refusing a release without notes." >&2
              exit 1
            fi
            cat >> "$notes" <<'EOF'

          ### Install
          Download and unzip `devready-plugin.zip`. In Figma desktop, choose Plugins → Development → Import plugin from manifest… and select `devready-plugin/manifest.json`. This is a local development plugin, not a Figma Community listing.
          EOF
            gh release create "${GITHUB_REF_NAME}" devready-plugin.zip \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$notes"
          fi
